<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d"><title id="t">FOX Studio. Protect.</title><desc id="d">Animated opening on a dark background. One word at a time in the centre, in hard cuts that get faster: the verb to protect in eight languages that share one root. PROTEGER (Portuguese, in orange), PROTECT (English), PROTÉGER (French), PROTEGGERE (Italian), PROTEGIR (Catalan), PROTEJA (Romanian), PROTEKTI (Esperanto) and PROTEGERE (Latin, the root of them all). The screen goes dark for a moment, and then only the FOX Studio fox-in-hexagon logo and the name FOX Studio remain.</desc><style>.a{animation-duration:10s;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}.s{animation-timing-function:step-end}@keyframes w0{0%{opacity:0}3%{opacity:1}14.5%{opacity:0}100%{opacity:0}}@keyframes w1{0%{opacity:0}14.5%{opacity:1}23.3%{opacity:0}100%{opacity:0}}@keyframes w2{0%{opacity:0}23.3%{opacity:1}30.5%{opacity:0}100%{opacity:0}}@keyframes w3{0%{opacity:0}30.5%{opacity:1}36.5%{opacity:0}100%{opacity:0}}@keyframes w4{0%{opacity:0}36.5%{opacity:1}41.6%{opacity:0}100%{opacity:0}}@keyframes w5{0%{opacity:0}41.6%{opacity:1}46%{opacity:0}100%{opacity:0}}@keyframes w6{0%{opacity:0}46%{opacity:1}49.9%{opacity:0}100%{opacity:0}}@keyframes w7{0%{opacity:0}49.9%{opacity:1}53.4%{opacity:0}100%{opacity:0}}@keyframes fin{0%{opacity:0}58.9%{opacity:0;animation-timing-function:cubic-bezier(.16,1,.3,1)}62.4%{opacity:1}96%{opacity:1;animation-timing-function:cubic-bezier(.65,0,.35,1)}98.8%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style><defs><path id="g0" d="M80 0V-710H355Q480 -710 550 -650Q620 -590 620 -484Q620 -413 588 -362Q556 -310 497 -283Q438 -256 355 -256H210V0H80ZM210 -369H349Q415 -369 450 -398Q486 -427 486 -484Q486 -540 451 -568Q415 -597 349 -597H210V-369Z"/><path id="g1" d="M80 0V-710H377Q454 -710 510 -684Q566 -658 59